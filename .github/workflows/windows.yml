name: Windows native

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-core:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install the repository toolchain
        run: rustup show
      - name: Verify Linux core compatibility
        run: cargo test --locked -j 2 --no-default-features --lib -p ros_studio_app -p ros_studio_codegen -p ros_studio_scan -p ros_studio_model -p ros_studio_protocol -p ros_studio_daemon
      - name: Test source export and Linux packaging
        run: python3 -m unittest discover -s script/tests -v
  linux-daemon:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    container: ros:humble-ros-base-jammy
    env:
      CARGO_HOME: /usr/local/cargo
      RUSTUP_HOME: /usr/local/rustup
    steps:
      - uses: actions/checkout@v4
      - name: Install the Linux ROS daemon build dependencies
        shell: bash
        run: |
          apt-get update
          # rclrs 0.7 links its vendored interfaces, including example_interfaces
          # and test_msgs, even when building the daemon without Rust tests.
          apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl git pkg-config python3 \
            ros-humble-example-interfaces ros-humble-std-msgs ros-humble-test-msgs
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"/\1/p' rust-toolchain.toml)
          test -n "$toolchain"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$toolchain"
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: Verify the ROS interface libraries
        shell: bash
        run: |
          for package in action_msgs builtin_interfaces example_interfaces rcl_interfaces rosgraph_msgs std_msgs test_msgs unique_identifier_msgs; do
            for suffix in rosidl_generator_c rosidl_typesupport_c; do
              library="/opt/ros/humble/lib/lib${package}__${suffix}.so"
              if [[ ! -f "$library" ]]; then
                echo "::error::Missing ROS interface library: $library"
                exit 1
              fi
            done
          done
      - name: Install the license notice generator
        run: cargo install cargo-about --version 0.8.2 --locked
      - name: Build and exercise the real ROS Humble daemon
        shell: bash
        run: |
          # Trust this checkout in the container user's Git configuration.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git rev-parse --verify HEAD
          bash script/build-ros2-studio-daemon-release
      - name: Upload the tested Linux daemon and notices
        uses: actions/upload-artifact@v4
        with:
          name: ros2-studio-linux-daemon-${{ github.sha }}
          path: |
            target/ros-humble/release/ros-studio-daemon
            target/ros-humble/THIRD-PARTY-LICENSES-DAEMON.md
            target/ros-humble/DAEMON-INFO.json
            target/ros-humble/runtime-smoke-tests.log
          if-no-files-found: error
          retention-days: 30
  windows:
    needs: [linux-core, linux-daemon]
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CARGO_HOME: C:\cargo
    steps:
      - uses: actions/checkout@v4
      - name: Install the repository toolchain
        shell: pwsh
        run: rustup show
      - name: Test the application core, scanner, generator, and protocol
        run: cargo test --locked -j 2 --no-default-features --lib -p ros_studio_app -p ros_studio_codegen -p ros_studio_scan -p ros_studio_model -p ros_studio_protocol -p ros_studio_daemon
      - name: Inspect the fixture without ROS or Docker
        run: cargo run --locked -j 2 -p ros_studio_app --no-default-features --example inspect_project -- examples/drone_demo_ws
      - name: Test source export
        run: python -m unittest discover -s script/tests -v
      - name: Build the native Windows executable and compiled shaders
        run: cargo build --locked --release -j 2 -p ros_studio_app --bin ros2-studio
      - name: Check executable startup
        shell: pwsh
        run: |
          & ./target/release/ros2-studio.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Windows executable failed to start.' }
      - name: Validate the Docker development script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/script/build-ros2-studio-daemon-windows.ps1", [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
      - name: Generate notices for the Windows application
        shell: pwsh
        run: |
          cargo install cargo-about --version 0.8.2 --locked
          if ($LASTEXITCODE -ne 0) { throw 'Cannot install cargo-about.' }
          New-Item -ItemType Directory -Force target/windows-notices | Out-Null
          cargo about generate --locked --fail --target x86_64-pc-windows-msvc --manifest-path crates/ros_studio_app/Cargo.toml --config script/licenses/zed-licenses.toml --output-file target/windows-notices/THIRD-PARTY-LICENSES-WINDOWS.md script/licenses/template.md.hbs
          if ($LASTEXITCODE -ne 0) { throw 'Cannot generate Windows notices.' }
      - name: Download the tested Linux ROS runtime component
        uses: actions/download-artifact@v4
        with:
          name: ros2-studio-linux-daemon-${{ github.sha }}
          path: target/ros-humble
      - name: Package the optimized portable application with its ROS daemon
        run: python script/ros2-studio-standalone windows-portable 0.2.0-alpha.4 --licenses target/windows-notices/THIRD-PARTY-LICENSES-WINDOWS.md --daemon-binary target/ros-humble/release/ros-studio-daemon --daemon-licenses target/ros-humble/THIRD-PARTY-LICENSES-DAEMON.md --daemon-info target/ros-humble/DAEMON-INFO.json
      - name: Upload the portable ZIP and checksum
        uses: actions/upload-artifact@v4
        with:
          name: ros2-studio-windows-x64-docker-preview-${{ github.sha }}
          path: |
            target/windows-portable/*.zip
            target/windows-portable/*.sha256
          if-no-files-found: error
          retention-days: 30
