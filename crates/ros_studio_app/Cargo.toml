[package]
name = "ros_studio_app"
version = "0.1.0"
edition.workspace = true
publish.workspace = true
license = "GPL-3.0-or-later"

[lints]
workspace = true

[lib]
path = "src/ros_studio_app.rs"
doctest = false

[[bin]]
name = "ros2-studio"
path = "src/main.rs"
required-features = ["gui"]

[features]
default = ["gui"]
gui = ["dep:gpui", "dep:gpui_platform", "dep:notify", "dep:walkdir", "dep:simplelog"]

[dependencies]
anyhow.workspace = true
ros_studio_model.workspace = true
ros_studio_scan.workspace = true
ros_studio_codegen.workspace = true
ros_studio_protocol.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
toml.workspace = true
tempfile.workspace = true
futures.workspace = true
async-io.workspace = true
gpui = { workspace = true, optional = true, features = ["x11", "wayland"] }
gpui_platform = { workspace = true, optional = true, features = ["font-kit", "wayland", "x11"] }
async-channel.workspace = true
async-process.workspace = true
notify = { version = "9.0.0-rc.4", optional = true }
walkdir = { workspace = true, optional = true }
simplelog = { workspace = true, optional = true }

